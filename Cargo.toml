[workspace]
resolver = "2"
members = [".", "xtask"]
# Their own workspaces: consumers of the crate (a wasm32 cdylib with serde, and two
# sample sites), kept out of the toolkit's build.
exclude = ["examples/svelte-wasm", "examples/yew-ssg", "examples/yew-trunk"]

[package]
name = "eona-ui-toolkit"
version = "0.9.2"
edition = "2021"
description = "Shared Yew atoms/molecules/organisms for the EONA-X design system — consumed by developer.eona-x.eu and, eventually, other EONA-X front-ends."
license = "Apache-2.0"
repository = "https://github.com/EONA-X/eona-ui-toolkit"
keywords = ["eona-x", "design-system", "yew", "components"]
readme = "README.md"

[dependencies]
# The whole dependency set. The toolkit is presentational Yew and nothing else:
# `serde`/`serde_json` left with the JSON-LD parser in `src/ontology.rs`, and the
# five `csr`-gated crates left with the `interactive` tier — both now live in
# `eona-vocabulary-ui`, their only consumer.
yew = "0.23"

[features]
# Consumers pick a renderer: `ssr` for static generation (developer.eona-x.eu),
# `csr` for a browser/WASM host (Trunk apps, the Streamlit component bridge).
# The components themselves are renderer-agnostic, so neither is on by default.
default = []
ssr = ["yew/ssr"]
# Now only picks Yew's renderer: the `interactive` module this also used to gate
# has moved to `eona-vocabulary-ui`. Kept as a feature name so that consumer's
# `features = ["csr"]` keeps resolving.
csr = ["yew/csr"]

[dev-dependencies]
yew = { version = "0.23", features = ["ssr"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# examples/render-docs.rs turns site/guides/*.md into the getting-started pages.
# A dev-dependency only: the crate's own dependency set stays `yew` alone.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
