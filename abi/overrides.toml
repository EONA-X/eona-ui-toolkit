# Components the generator refuses to emit, and what was decided about each.
#
# `cargo xtask check` requires an entry here for every component whose Status is
# not `ok`. The Status already carries a machine-generated reason; this file is
# where a human records what is being done about it, so that a component absent
# from the React package is a decision on the record rather than an omission
# nobody noticed.
#
# Keys are free-form. `reason` restates the decision in a person's words;
# `source` points at the line that forces it; `disposition` says what consumers
# should do until it changes.

# Empty of NeedsOverride entries as of eona-x/backlog#822; the data-driven charts below are
# WasmOnly and were added by eona-x/backlog#1219. Every former entry — Swatch, PaletteGroup,
# DatasetCard, OntoAnnotation and Modal — was resolved by changing the component
# rather than by recording a decision to live with it: the derivation moved out
# and its result became a prop, so the markup is a pass-through and the generator
# can splice it. All 41 in-scope components now emit.
#
# The file stays because its job does. The next component that cannot be emitted
# needs a human's decision here before `check` will pass.

[BarChart]
reason = "Parses a JSON-LD dataset in Rust and draws it in the browser; there is no React equivalent and the data-driven charts are WebAssembly-only."
source = "src/charts/bar.rs"
tracked_by = "eona-x/backlog#1219"
disposition = "Svelte: CubeChart from @eona-x/ui-toolkit-svelte/wasm; React: not planned (eona-x/backlog#1219)"

