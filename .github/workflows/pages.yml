# Publishes the toolkit's documentation to GitHub Pages:
#
#   /                          overview of the three stacks
#   /<stack>/getting-started/  install, first component, static site, theming
#                              (site/guides/<stack>.md), for yew, react, svelte
#   /yew/                      the gallery: every component's Yew, React and
#                              Svelte call side by side, and the design sections
#   /react/, /svelte/          every call, rendered live by React / Svelte
#
# The Yew pages are rendered server-side by `examples/render-docs.rs`; every
# page, the live ones included, carries the same navigation (the toolkit's own
# SiteHeader; links in site/nav.json for the Vite builds).
#
# The two live pages (`site/`) render `site/*/src/gallery.*`, which bridgegen
# writes from the same `abi/examples.json` the gallery prints, against the
# packages built from this commit — so the three can never show different calls.
# EONA-X's developer portal publishes the gallery as `components.html` inside a
# larger site; this deploy serves it standalone from the repository that owns it.
name: Publish the component gallery

on:
  push:
    branches: [main]
    # Anything that can change what a page renders.
    paths:
      - 'src/**'
      - 'assets/**'
      - 'bridge/**'
      - 'examples/**'
      - 'packages/**'
      - 'site/**'
      - 'Cargo.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege plus the two tokens the Pages deploy itself needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Newer pushes supersede an in-flight run rather than
# queueing behind it, since only the latest tree is worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Gate the deploy on the tests that pin what this page renders: ssr_parity
      # keeps `inert` on the modal and the submenu, and demo_page checks the
      # gallery's own structure. Publishing a page the crate's own tests reject
      # would be worse than not publishing.
      - name: Test
        run: cargo test --features ssr

      # The committed React package and ABI must match `src/`. The page documents
      # both stacks from one source of truth, so a stale `bridge/examples.rs` would
      # show React snippets for a crate that has moved on. Replays committed
      # verdicts; no browser, no wasm toolchain.
      - name: Check generated output is not stale
        run: cargo run -p xtask -- check

      - name: Render the gallery
        run: cargo run --example render-docs --features ssr -- dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Against the local stylesheet: this commit's version may not be on npm yet.
      - name: Build the packages
        run: |
          (cd packages/react && npm install --no-save --no-audit --no-fund ../css && npm run build)
          (cd packages/svelte && npm install --no-save --no-audit --no-fund ../css && npm run build)

      - name: Build the live pages
        run: |
          for stack in react svelte; do
            (cd site/$stack && npm ci --no-audit --no-fund && npm run build)
            # Merged into the directory render-docs already wrote: it holds
            # this stack's getting-started page.
            mkdir -p dist/$stack && cp -r site/$stack/dist/. dist/$stack/
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
