# Holds the two generated packages to the Yew source and to each other.
#
# `pages.yml` already runs the drift gate before a deploy, but only on `main`.
# This runs on every push and pull request, and adds what needs Node: that the
# Svelte package typechecks and builds, that every generated component renders
# the same HTML through React and Svelte, that the published stylesheet styles
# them exactly as the crate's own sheets do, and that the opt-in WASM entry
# mounts a real Yew build.
name: Bridges

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/svelte-wasm
            wasm/charts
            examples/yew-ssg
            examples/yew-trunk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Menu package tests
        working-directory: packages/menu
        # css is linked from the repo: a release bumps its version before it is on npm.
        run: |
          npm install --no-save --no-audit --no-fund ../css
          npm test

      - name: Generated output is not stale
        run: cargo run -p xtask -- check

      - name: Rust tests, with the charts and the page
        run: cargo test --features ssr,charts

      # Before the Svelte build: its `postbuild` copies this output into `dist`.
      - name: Build the charts WASM
        run: |
          npm install -g wasm-pack
          wasm-pack build --target web --release wasm/charts

      - name: The charts WASM is within its size budget
        run: |
          size=$(gzip -9 -c wasm/charts/pkg/eona_ui_toolkit_charts_bg.wasm | wc -c)
          echo "charts wasm: $size bytes gzip (budget 200000)"
          test "$size" -le 200000 || { echo "::error::charts wasm is $size bytes gzip, over the 200000 budget"; exit 1; }

      # `../css`, not the registry: both component packages depend on
      # @eona-x/ui-toolkit-css at their own version, which is not on npm until
      # that version is released. `--no-save` leaves package.json as generated.
      - name: Svelte package typechecks and builds
        working-directory: packages/svelte
        run: |
          npm install --no-save --no-audit --no-fund ../css
          npm run check
          npm run build

      # esbuild (the parity harness) strips types, so only tsc sees a prop of the
      # wrong type in a generated .tsx.
      - name: React package typechecks and builds
        working-directory: packages/react
        run: |
          npm install --no-save --no-audit --no-fund ../css
          npm run typecheck
          npm run build

      - name: React and Svelte render the same HTML
        working-directory: tests/bridge-parity
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: The demo page scripts drive the stack tabs, Copy and the live charts
        working-directory: tests/demo-page
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: The published stylesheet styles them like the crate's
        working-directory: tests/bridge-parity
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:css

      - name: Build the WASM example
        run: |
          wasm-pack build --target web --release examples/svelte-wasm

      - name: The WASM entry mounts a real Yew build
        working-directory: tests/bridge-parity
        run: npm run test:wasm

      - name: CubeChart fetches, mounts and updates a real charts build
        working-directory: tests/bridge-parity
        run: npm run test:wasm-charts

      - name: The Yew static-site sample renders its pages
        working-directory: examples/yew-ssg
        run: |
          cargo run
          grep -q 'class="site-header' dist/index.html
          grep -q 'class="site-header' dist/about/index.html

      - name: The Yew Trunk sample builds
        working-directory: examples/yew-trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/trunk" build --release
          ls dist/*.wasm dist/logo/logo-transparent.svg

      # The generator, end to end: scaffold a site, point it at this commit's
      # packages (this version is not on npm until it is released), build it.
      - name: npm create @eona-x/app produces a site that builds
        run: |
          node packages/create-app/index.js "$RUNNER_TEMP/generated" --no-install
          cd "$RUNNER_TEMP/generated"
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/packages/css" "$GITHUB_WORKSPACE/packages/svelte"
          npm run build
          grep -q 'class="site-header' build/index.html
          grep -q 'class="site-header' build/about.html

  # The chart reader and the vocabulary's chart profile, held to each other: the
  # fixtures and the context are byte-for-byte copies, and pySHACL (the shapes) and
  # `cube::from_jsonld` (the reader) reach the same verdict on every fixture and
  # accept every sample of the components page.
  chart-profile:
    runs-on: ubuntu-latest
    env:
      # The eona-vocabularies-reference commit whose `eonax-chart-profile` this tree is
      # checked against. Bump it together with src/cube/context.jsonld and
      # tests/fixtures/cube/profile/ when the profile changes.
      VOCABULARIES_SHA: f218a5c97a73880a0bca30b28c6f96c0e0a7277b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Eona-X/eona-vocabularies-reference
          ref: ${{ env.VOCABULARIES_SHA }}
          path: vocabularies

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pySHACL
        run: pip install pyshacl==0.40.1

      - name: The reader and the shapes agree
        run: tests/differential.sh vocabularies
