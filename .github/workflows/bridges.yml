# Holds the two generated packages to the Yew source and to each other.
#
# `pages.yml` already runs the drift gate before a deploy, but only on `main`.
# This runs on every push and pull request, and adds what needs Node: that the
# Svelte package typechecks and builds, that every generated component renders
# the same HTML through React and Svelte, that the published stylesheet styles
# them exactly as the crate's own sheets do, and that the opt-in WASM entry
# mounts a real Yew build.
name: Bridges

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/svelte-wasm
            examples/yew-ssg
            examples/yew-trunk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generated output is not stale
        run: cargo run -p xtask -- check

      # `../css`, not the registry: both component packages depend on
      # @eona-x/ui-toolkit-css at their own version, which is not on npm until
      # that version is released. `--no-save` leaves package.json as generated.
      - name: Svelte package typechecks and builds
        working-directory: packages/svelte
        run: |
          npm install --no-save --no-audit --no-fund ../css
          npm run check
          npm run build

      - name: React and Svelte render the same HTML
        working-directory: tests/bridge-parity
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: The published stylesheet styles them like the crate's
        working-directory: tests/bridge-parity
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:css

      - name: Build the WASM example
        run: |
          npm install -g wasm-pack
          wasm-pack build --target web --release examples/svelte-wasm

      - name: The WASM entry mounts a real Yew build
        working-directory: tests/bridge-parity
        run: npm run test:wasm

      - name: The Yew static-site sample renders its pages
        working-directory: examples/yew-ssg
        run: |
          cargo run
          grep -q 'class="site-header' dist/index.html
          grep -q 'class="site-header' dist/about/index.html

      - name: The Yew Trunk sample builds
        working-directory: examples/yew-trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/trunk" build --release
          ls dist/*.wasm dist/logo/logo-transparent.svg

      # The generator, end to end: scaffold a site, point it at this commit's
      # packages (this version is not on npm until it is released), build it.
      - name: npm create @eona-x/app produces a site that builds
        run: |
          node packages/create-app/index.js "$RUNNER_TEMP/generated" --no-install
          cd "$RUNNER_TEMP/generated"
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/packages/css" "$GITHUB_WORKSPACE/packages/svelte"
          npm run build
          grep -q 'class="site-header' build/index.html
          grep -q 'class="site-header' build/about.html
