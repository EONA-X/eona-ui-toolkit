# Publishes the three npm packages when a version tag is pushed.
#
#   @eona-x/ui-toolkit-css     packages/css
#   @eona-x/ui-toolkit-react   packages/react   (depends on -css at the same version)
#   @eona-x/ui-toolkit-svelte  packages/svelte  (depends on -css at the same version)
#   @eona-x/create-app         packages/create-app (`npm create @eona-x/app`; its
#                              template pins the toolkit at the same version)
#
# Release: bump `version` in Cargo.toml and `PACKAGE_VERSION` in xtask/src/emit.rs
# (a unit test holds them equal), run `cargo xtask bridgegen`, merge, then
# `git tag vX.Y.Z && git push origin vX.Y.Z`. A tag that disagrees with either
# version is refused before anything is built.
#
# Authentication is npm trusted publishing (OIDC): no long-lived token, and
# every release carries a provenance attestation tying it to this workflow
# run.
#
# The release is STAGED, not published: the packages' trusted-publisher
# configurations are stage-only, so this workflow runs `npm stage publish`,
# which puts each version in npm's stage queue. Nothing is installable until a
# maintainer approves it with 2FA — npmjs.com -> Staged Packages, or
# `npm stage approve <stage-id>` — and an OIDC token cannot approve. Approve
# `@eona-x/ui-toolkit-css` first: the other two depend on it at this version.
name: Publish to npm

on:
  push:
    tags: ['v*']
  # Re-run a release whose publish step failed half-way: already-published
  # packages are skipped, so this only publishes what is missing.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.9.0'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships 10.x.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: The tag, the crate and the packages agree on the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          crate=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag $want, crate $crate"
          test "$crate" = "$want" || { echo "::error::Cargo.toml is $crate, tag is $TAG"; exit 1; }
          for p in css react svelte create-app; do
            v=$(node -p "require('./packages/$p/package.json').version")
            d=$(node -p "(require('./packages/$p/package.json').dependencies || {})['@eona-x/ui-toolkit-css'] || '$want'")
            echo "$p $v (css dependency $d)"
            test "$v" = "$want" && test "$d" = "$want" || { echo "::error::packages/$p is $v (css $d), tag is $TAG"; exit 1; }
          done

      # Nothing is published from a tree the gate rejects.
      - name: Generated output is not stale
        run: cargo run -p xtask -- check

      # Against the local `packages/css`: this release's stylesheet is not on
      # npm until the Publish step below puts it there.
      - name: Build
        run: |
          (cd packages/react && npm install --no-save --no-audit --no-fund ../css && npm run build)
          (cd packages/svelte && npm install --no-save --no-audit --no-fund ../css && npm run check && npm run build)

      - name: Bridges render the same HTML, styled the same
        working-directory: tests/bridge-parity
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          npm test
          npm run test:css

      # CSS first: the other two depend on it at exactly this version.
      # A version already on npm, or already in the stage queue, is skipped,
      # so a run that failed half-way can be re-run with workflow_dispatch.
      - name: Stage for approval
        run: |
          {
            echo "## Staged for approval"
            echo
            echo "Approve on npmjs.com (Staged Packages) or with \`npm stage approve <stage-id>\`, css first."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for p in css react svelte create-app; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            # npm attaches a trusted publisher only to a package that exists, so
            # a package's very first version is published by hand (`npm publish
            # --otp`), then its trusted publisher configured; until then it is
            # skipped here rather than failing the whole release.
            if ! npm view "$name" name >/dev/null 2>&1; then
              echo "::warning::$name is not on npm yet: publish $version by hand once, then add its trusted publisher"
              echo "- \`$name@$version\` **not staged**: first release must be published by hand" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
              echo "- \`$name@$version\` already published" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if out=$(cd "packages/$p" && npm stage publish --provenance --access public 2>&1); then
              echo "$out"
              echo "- \`$name@$version\` staged" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$out" | grep -iE "stage|id" >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif echo "$out" | grep -qiE "already (staged|exists)|E409|conflict"; then
              echo "$out"
              echo "$name@$version is already staged; skipping"
              echo "- \`$name@$version\` was already staged" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$out"
              exit 1
            fi
          done
