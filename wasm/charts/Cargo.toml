[package]
name = "eona-ui-toolkit-charts"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Rust half of @eona-x/ui-toolkit-svelte/wasm/charts: one `mount` export for the five data-driven charts."
license = "Apache-2.0"

# Its own workspace: this crate targets wasm32 and pulls serde, neither of which
# belongs in the toolkit's dependency set.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eona-ui-toolkit = { path = "../..", features = ["csr", "charts"] }
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Element"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true

# wasm-pack runs wasm-opt on the release build; -Oz is the size-first setting the
# size budget in CI is measured against.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
