[package]
name = "eona-yew-ssg-sample"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sample: a branded static site rendered by Yew at build time — plain HTML and CSS, no WebAssembly."
license = "Apache-2.0"

# Its own workspace, like examples/svelte-wasm: a consumer of the crate, not part of its build.
[workspace]

[dependencies]
# Outside this repository, depend on a release instead:
# eona-ui-toolkit = { git = "https://github.com/EONA-X/eona-ui-toolkit", tag = "v0.9.2", features = ["ssr"] }
eona-ui-toolkit = { path = "../..", features = ["ssr"] }
yew = { version = "0.23", features = ["ssr"] }
tokio = { version = "1", features = ["macros", "rt"] }
